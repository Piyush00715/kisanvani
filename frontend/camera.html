<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KisanVani - Plant Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        body { background-color: #000; margin: 0; overflow: hidden; }
        .camera-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            z-index: 20;
        }
        .capture-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: white;
            border: 4px solid #aaa;
            box-shadow: 0 0 0 2px white;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .capture-btn:active {
            transform: scale(0.95);
        }
        .text-btn {
            color: white;
            font-size: 18px;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            padding: 12px 24px;
            cursor: pointer;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            z-index: 20;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .overlay {
            position: absolute;
            inset: 0;
            border: 2px dashed rgba(255,255,255,0.5);
            margin: 20% 10%;
            border-radius: 16px;
            pointer-events: none;
            z-index: 10;
        }
        .hint {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            z-index: 20;
            padding: 0 20px;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>
<!-- Mobile Sliding Drawer -->
<div id="mobileDrawerOverlay" class="fixed inset-0 bg-black/50 z-[90] hidden opacity-0 transition-opacity duration-300"></div>
<aside id="mobileDrawer" class="fixed top-0 left-0 h-full w-72 bg-surface z-[100] transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="p-6 border-b border-outline-variant/30 flex justify-between items-center bg-surface-container-low">
        <div>
            <h2 class="font-headline-sm text-2xl font-bold text-primary">KisanVani</h2>
            <p class="text-sm text-on-surface-variant mt-1 font-medium">Premium Agri-SaaS</p>
        </div>
        <button id="closeDrawerBtn" class="text-on-surface-variant hover:text-primary transition-colors p-2 rounded-full hover:bg-surface-container">
            <span class="material-symbols-outlined text-2xl">close</span>
        </button>
    </div>
    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-2 font-body-md text-on-surface-variant">
        <a href="/index.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-primary-container/30 hover:text-primary transition-colors ">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="font-label-md font-bold">Dashboard</span>
        </a>
        <a href="/crop.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-primary-container/30 hover:text-primary transition-colors ">
            <span class="material-symbols-outlined">potted_plant</span>
            <span class="font-label-md font-bold">Crop Recommendation</span>
        </a>
        <a href="/disease.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-primary-container/30 hover:text-primary transition-colors ">
            <span class="material-symbols-outlined">biotech</span>
            <span class="font-label-md font-bold">Disease Detection</span>
        </a>
        <a href="/weather.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-primary-container/30 hover:text-primary transition-colors ">
            <span class="material-symbols-outlined">wb_sunny</span>
            <span class="font-label-md font-bold">Weather Advisory</span>
        </a>
        <a href="/news.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-primary-container/30 hover:text-primary transition-colors ">
            <span class="material-symbols-outlined">newspaper</span>
            <span class="font-label-md font-bold">Agri-News & Schemes</span>
        </a>
    
        <div class="mt-6">
            <button onclick="logoutUser()" class="flex items-center justify-center gap-3 px-4 py-3 rounded-xl bg-primary text-white hover:opacity-90 transition-all w-full shadow-md active:scale-95">
                <span class="material-symbols-outlined">logout</span>
                <span class="font-label-md font-bold">Logout</span>
            </button>
        </div>
    </nav>
</aside>


<div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <img id="photo-preview" src="" class="hidden w-full h-full object-cover absolute inset-0 z-10" />
    
    <div class="overlay" id="overlay"></div>
    <div class="hint" id="hint">Position the leaf inside the frame</div>
    
    <div class="close-btn" onclick="window.location.href='index.html'">
        <span class="material-symbols-outlined !text-3xl">close</span>
    </div>
    
    <div class="controls" id="capture-controls">
        <div class="capture-btn" onclick="takePhoto()"></div>
    </div>
    
    <div class="controls hidden" id="action-controls">
        <div class="text-btn" onclick="retakePhoto()">Retake</div>
        <div class="text-btn" onclick="confirmPhoto()">Done</div>
    </div>
    
    <canvas id="canvas"></canvas>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const photoPreview = document.getElementById('photo-preview');
    const overlay = document.getElementById('overlay');
    const hint = document.getElementById('hint');
    const captureControls = document.getElementById('capture-controls');
    const actionControls = document.getElementById('action-controls');
    
    let stream;
    let capturedDataUrl = null;

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' } 
            });
            video.srcObject = stream;
        } catch (err) {
            console.error("Error accessing camera:", err);
            alert("Could not access the camera. Please ensure permissions are granted.");
        }
    }

    function takePhoto() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        capturedDataUrl = canvas.toDataURL('image/jpeg');
        
        photoPreview.src = capturedDataUrl;
        photoPreview.classList.remove('hidden');
        video.classList.add('hidden');
        overlay.classList.add('hidden');
        hint.classList.add('hidden');
        
        captureControls.classList.add('hidden');
        actionControls.classList.remove('hidden');
    }

    function retakePhoto() {
        photoPreview.classList.add('hidden');
        video.classList.remove('hidden');
        overlay.classList.remove('hidden');
        hint.classList.remove('hidden');
        
        actionControls.classList.add('hidden');
        captureControls.classList.remove('hidden');
        capturedDataUrl = null;
    }

    function confirmPhoto() {
        if (capturedDataUrl) {
            // Save to sessionStorage and redirect
            sessionStorage.setItem('kisanvani_captured_image', capturedDataUrl);
            if(stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            window.location.href = 'disease.html';
        }
    }

    // Start camera when page loads
    window.addEventListener('load', startCamera);
</script>


<script>
document.addEventListener("DOMContentLoaded", () => {
    const mobileDrawer = document.getElementById('mobileDrawer');
    const mobileDrawerOverlay = document.getElementById('mobileDrawerOverlay');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    
    // Find menu button
    const menuIcons = Array.from(document.querySelectorAll('header .material-symbols-outlined, nav .material-symbols-outlined'));
    const menuIcon = menuIcons.find(el => el.innerText.trim() === 'menu');
    
    if (menuIcon && mobileDrawer && mobileDrawerOverlay) {
        const menuBtn = menuIcon.tagName === 'BUTTON' ? menuIcon : menuIcon.parentElement;
        
        // Remove old event listeners if any by cloning
        const newMenuBtn = menuBtn.cloneNode(true);
        menuBtn.parentNode.replaceChild(newMenuBtn, menuBtn);
        
        newMenuBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            mobileDrawerOverlay.classList.remove('hidden');
            // small delay for display block to take effect before opacity transition
            setTimeout(() => {
                mobileDrawerOverlay.classList.remove('opacity-0');
                mobileDrawer.classList.remove('-translate-x-full');
            }, 10);
        });
    }

    function closeDrawer() {
        if(mobileDrawer && mobileDrawerOverlay) {
            mobileDrawer.classList.add('-translate-x-full');
            mobileDrawerOverlay.classList.add('opacity-0');
            setTimeout(() => {
                mobileDrawerOverlay.classList.add('hidden');
            }, 300);
        }
    }

    if(closeDrawerBtn) closeDrawerBtn.addEventListener('click', closeDrawer);
    if(mobileDrawerOverlay) mobileDrawerOverlay.addEventListener('click', closeDrawer);
});
</script>

<script>
function logoutUser() {
    localStorage.removeItem("kisanvani_token");
    window.location.href = "/login.html";
}
</script>
</body>
</html>

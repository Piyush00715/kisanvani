<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>KisanVani - Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-container": "#00873a",
                        "on-primary-container": "#f7fff2",
                        "primary": "#006b2c",
                        "on-primary": "#ffffff",
                        "surface": "#f8f9ff",
                        "on-surface": "#0b1c30",
                        "surface-variant": "#d3e4fe",
                        "on-surface-variant": "#3e4a3d",
                        "outline-variant": "#bdcaba",
                        "outline": "#6e7b6c",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                    },
                    fontFamily: {
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9ff; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<!-- Mobile Sliding Drawer -->
<div id="mobileDrawerOverlay" class="fixed inset-0 bg-black/50 z-[90] hidden opacity-0 transition-opacity duration-300"></div>
<aside id="mobileDrawer" class="fixed top-0 left-0 h-full w-72 bg-surface z-[100] transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="p-6 border-b border-outline-variant/30 flex justify-between items-center bg-surface-container-low">
        <div>
            <h2 class="font-headline-sm text-2xl font-bold text-primary">KisanVani</h2>
            <p class="text-sm text-on-surface-variant mt-1 font-medium">Premium Agri-SaaS</p>
        </div>
        <button id="closeDrawerBtn" class="text-on-surface-variant hover:text-primary transition-colors p-2 rounded-full hover:bg-surface-container">
            <span class="material-symbols-outlined text-2xl">close</span>
        </button>
    </div>
    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-2 font-body-md text-on-surface-variant">
        <a href="/index.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-primary-container/30 hover:text-primary transition-colors ">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="font-label-md font-bold">Dashboard</span>
        </a>
        <a href="/crop.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-primary-container/30 hover:text-primary transition-colors ">
            <span class="material-symbols-outlined">potted_plant</span>
            <span class="font-label-md font-bold">Crop Recommendation</span>
        </a>
        <a href="/disease.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-primary-container/30 hover:text-primary transition-colors ">
            <span class="material-symbols-outlined">biotech</span>
            <span class="font-label-md font-bold">Disease Detection</span>
        </a>
        <a href="/weather.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-primary-container/30 hover:text-primary transition-colors ">
            <span class="material-symbols-outlined">wb_sunny</span>
            <span class="font-label-md font-bold">Weather Advisory</span>
        </a>
        <a href="/news.html" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-primary-container/30 hover:text-primary transition-colors ">
            <span class="material-symbols-outlined">newspaper</span>
            <span class="font-label-md font-bold">Agri-News & Schemes</span>
        </a>
    </nav>
</aside>


    <div class="glass-card w-full max-w-md rounded-2xl p-8 transition-all duration-300">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container/20 text-primary mb-4">
                <span class="material-symbols-outlined text-4xl">agriculture</span>
            </div>
            <h1 class="text-3xl font-bold text-on-surface">KisanVani</h1>
            <p class="text-on-surface-variant mt-2">Sign in to your farmer dashboard</p>
        </div>

        <!-- Phone Section -->
        <div id="phoneSection" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-on-surface-variant mb-2">Phone Number</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-3 text-on-surface-variant/50">call</span>
                    <input id="phoneInput" type="tel" class="w-full bg-surface border border-outline-variant rounded-xl pl-10 pr-4 py-3 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="+91 XXXXX XXXXX">
                </div>
            </div>
            <button id="sendOtpBtn" class="w-full bg-primary text-on-primary py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-primary/90 transition-all">
                Send OTP <span class="material-symbols-outlined text-sm">arrow_forward</span>
            </button>
        </div>

        <!-- OTP Section -->
        <div id="otpSection" class="space-y-6 hidden">
            <div>
                <label class="block text-sm font-semibold text-on-surface-variant mb-2">Enter OTP</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-3 text-on-surface-variant/50">password</span>
                    <input id="otpInput" type="text" class="w-full bg-surface border border-outline-variant rounded-xl pl-10 pr-4 py-3 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-center tracking-widest text-lg font-bold" placeholder="• • • • • •">
                </div>
            </div>
            <button id="verifyOtpBtn" class="w-full bg-primary text-on-primary py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-primary/90 transition-all">
                Verify OTP <span class="material-symbols-outlined text-sm">check_circle</span>
            </button>
            <button id="backToPhoneBtn" class="w-full text-primary text-sm font-semibold hover:underline mt-2">Change Phone Number</button>
        </div>

        <!-- Register Section -->
        <div id="registerSection" class="space-y-6 hidden">
            <div class="bg-primary-container/10 p-4 rounded-xl mb-4 border border-primary-container/20">
                <p class="text-sm text-primary font-medium flex items-center gap-2">
                    <span class="material-symbols-outlined text-base">info</span>
                    Looks like you're new here! Let's set up your profile.
                </p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-on-surface-variant mb-2">Select your State</label>
                <select id="stateSelect" class="w-full bg-surface border border-outline-variant rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    <option value="" disabled selected>-- Select State --</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Bihar">Bihar</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <button id="registerBtn" class="w-full bg-primary text-on-primary py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-primary/90 transition-all">
                Complete Registration <span class="material-symbols-outlined text-sm">how_to_reg</span>
            </button>
        </div>

    </div>

    <script>
        const phoneSection = document.getElementById('phoneSection');
        const otpSection = document.getElementById('otpSection');
        const registerSection = document.getElementById('registerSection');
        
        const phoneInput = document.getElementById('phoneInput');
        const otpInput = document.getElementById('otpInput');
        const stateSelect = document.getElementById('stateSelect');
        
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const registerBtn = document.getElementById('registerBtn');
        const backToPhoneBtn = document.getElementById('backToPhoneBtn');

        let currentPhone = "";

        // Check if already logged in
        if (localStorage.getItem("kisanvani_token")) {
            window.location.href = "/index.html";
        }

        sendOtpBtn.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            if(!phone) { alert("Please enter phone number."); return; }
            
            sendOtpBtn.innerText = "Sending...";
            sendOtpBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: phone })
                });
                if(!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Failed to send OTP");
                }
                currentPhone = phone;
                phoneSection.classList.add('hidden');
                otpSection.classList.remove('hidden');
            } catch (err) {
                alert(err.message);
            } finally {
                sendOtpBtn.innerHTML = `Send OTP <span class="material-symbols-outlined text-sm">arrow_forward</span>`;
                sendOtpBtn.disabled = false;
            }
        });

        backToPhoneBtn.addEventListener('click', () => {
            otpSection.classList.add('hidden');
            phoneSection.classList.remove('hidden');
        });

        verifyOtpBtn.addEventListener('click', async () => {
            const otp = otpInput.value.trim();
            if(!otp) { alert("Please enter OTP."); return; }
            
            verifyOtpBtn.innerText = "Verifying...";
            verifyOtpBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: currentPhone, otp: otp })
                });
                if(!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Invalid OTP");
                }
                const data = await res.json();
                
                if (data.is_new_user) {
                    otpSection.classList.add('hidden');
                    registerSection.classList.remove('hidden');
                } else {
                    // Existing user
                    localStorage.setItem("kisanvani_token", data.token);
                    localStorage.setItem("kisanvani_lang", data.preferred_language);

                    window.location.href = "/index.html";
                }
            } catch (err) {
                alert(err.message);
            } finally {
                verifyOtpBtn.innerHTML = `Verify OTP <span class="material-symbols-outlined text-sm">check_circle</span>`;
                verifyOtpBtn.disabled = false;
            }
        });

        registerBtn.addEventListener('click', async () => {
            const state = stateSelect.value;
            if(!state) { alert("Please select a state."); return; }
            
            registerBtn.innerText = "Registering...";
            registerBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: currentPhone, state: state })
                });
                if(!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Registration failed");
                }
                const data = await res.json();
                localStorage.setItem("kisanvani_token", data.token);
                localStorage.setItem("kisanvani_lang", data.preferred_language);

                window.location.href = "/index.html";
            } catch (err) {
                alert(err.message);
            } finally {
                registerBtn.innerHTML = `Complete Registration <span class="material-symbols-outlined text-sm">how_to_reg</span>`;
                registerBtn.disabled = false;
            }
        });
    </script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const headerTitle = document.querySelector('h1.text-primary, h1.text-headline-md');
    if (headerTitle) {
        headerTitle.style.cursor = 'pointer';
        headerTitle.addEventListener('click', () => { window.location.href = '/index.html'; });
    }
    
});
</script>


<script>
document.addEventListener("DOMContentLoaded", () => {
    const mobileDrawer = document.getElementById('mobileDrawer');
    const mobileDrawerOverlay = document.getElementById('mobileDrawerOverlay');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    
    // Find menu button
    const menuIcons = Array.from(document.querySelectorAll('header .material-symbols-outlined, nav .material-symbols-outlined'));
    const menuIcon = menuIcons.find(el => el.innerText.trim() === 'menu');
    
    if (menuIcon && mobileDrawer && mobileDrawerOverlay) {
        const menuBtn = menuIcon.tagName === 'BUTTON' ? menuIcon : menuIcon.parentElement;
        
        // Remove old event listeners if any by cloning
        const newMenuBtn = menuBtn.cloneNode(true);
        menuBtn.parentNode.replaceChild(newMenuBtn, menuBtn);
        
        newMenuBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            mobileDrawerOverlay.classList.remove('hidden');
            // small delay for display block to take effect before opacity transition
            setTimeout(() => {
                mobileDrawerOverlay.classList.remove('opacity-0');
                mobileDrawer.classList.remove('-translate-x-full');
            }, 10);
        });
    }

    function closeDrawer() {
        if(mobileDrawer && mobileDrawerOverlay) {
            mobileDrawer.classList.add('-translate-x-full');
            mobileDrawerOverlay.classList.add('opacity-0');
            setTimeout(() => {
                mobileDrawerOverlay.classList.add('hidden');
            }, 300);
        }
    }

    if(closeDrawerBtn) closeDrawerBtn.addEventListener('click', closeDrawer);
    if(mobileDrawerOverlay) mobileDrawerOverlay.addEventListener('click', closeDrawer);
});
</script>
</body>
</html>
